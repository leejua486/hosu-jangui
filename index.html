<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="호수장의 · 모바일 부고장" />
  <meta property="og:description" content="삼가 고인의 명복을 빕니다. 모바일 부고장 및 답례인사" />
  <meta property="og:image" content="https://leejua486.github.io/hosu-jangui/cover.jpg" />
  <title>호수장의 · 모바일 부고장 · 답례인사</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
  <style>
    :root {
      --bg: #f3f0ea;
      --surface: #ffffff;
      --ink: #1a2028;
      --muted: #6c727a;
      --line: #e4ded3;
      --navy: #161d26;
      --navy-soft: #232d3b;
      --gold: #b08d57;
      --gold-light: #d4bc8e;
      --kakao: #fee500;
      --kakao-ink: #191919;
      --sms: #1a222d;
      --accent-soft: #f6f3ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(circle at top, #f8f6f1 0%, var(--bg) 100%);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: linear-gradient(180deg, #11171f 0%, var(--navy) 100%);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 4px 20px rgba(17, 23, 31, 0.14);
    }
    header h1 {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: 24px;
      letter-spacing: 6px;
      font-weight: 600;
      color: #f9f6ef;
    }
    header p {
      margin: 6px 0 0;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--gold-light);
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 14px 56px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 13px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--navy);
      color: #f9f6ef;
      border-color: var(--navy);
      box-shadow: 0 4px 12px rgba(22, 29, 38, 0.18);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 24px rgba(22, 29, 38, 0.04);
    }
    .card h2 {
      margin: 0 0 14px;
      font-family: "Noto Serif KR", serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0ece4;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fcfbf9;
      color: var(--ink);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    textarea { resize: vertical; min-height: 96px; line-height: 1.65; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(176, 141, 87, 0.12);
    }
    .sangju-row {
      display: grid;
      grid-template-columns: 88px 1fr 1.2fr 36px;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    @media (max-width: 480px) {
      .sangju-row { grid-template-columns: 78px 1fr 1fr 34px; }
    }
    .btn-sm {
      padding: 7px 12px;
      border: 1px solid #ded6c8;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--navy);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-sm:hover { background: #ebe5d9; }
    .btn-del {
      padding: 9px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #a93232;
      font-size: 13px;
      cursor: pointer;
    }
    .preview-box {
      background: linear-gradient(180deg, #fffefb 0%, #faf7f0 100%);
      border: 1px solid #d8cebd;
      border-radius: 18px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(22, 29, 38, 0.08);
    }
    .preview-hero {
      position: relative;
      height: 158px;
      background: var(--navy) url("./cover.jpg") center 42% / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 18px 16px;
      text-align: center;
    }
    .preview-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(16, 21, 28, 0.25) 0%, rgba(16, 21, 28, 0.78) 100%);
    }
    .preview-hero > * { position: relative; z-index: 1; }
    .hero-kanji {
      font-family: "Noto Serif KR", serif;
      font-size: 12px;
      letter-spacing: 5px;
      color: var(--gold-light);
      margin-bottom: 4px;
    }
    .hero-brand {
      font-family: "Noto Serif KR", serif;
      font-size: 15px;
      letter-spacing: 3px;
      color: #fff;
      font-weight: 600;
    }
    .preview-body {
      padding: 24px 20px 22px;
    }
    .preview-ribbon {
      text-align: center;
      padding-bottom: 18px;
      border-bottom: 1px solid #e6dfd2;
      margin-bottom: 18px;
    }
    .ribbon-tag {
      display: inline-block;
      font-family: "Noto Serif KR", serif;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--gold);
      border: 1px solid rgba(176, 141, 87, 0.55);
      background: rgba(176, 141, 87, 0.06);
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .preview-title {
      font-family: "Noto Serif KR", serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      margin: 0;
      letter-spacing: -0.3px;
    }
    .preview-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 7px 0 0;
    }
    .preview-msg {
      font-family: "Noto Serif KR", serif;
      white-space: pre-line;
      font-size: 14px;
      line-height: 1.85;
      color: #2b323b;
      text-align: center;
      margin: 18px 0;
      padding: 18px 14px;
      background: #f5f1e8;
      border-top: 1px solid #e5ddd0;
      border-bottom: 1px solid #e5ddd0;
      border-radius: 10px;
    }
    .info-list {
      border-top: 1px solid #e6dfd2;
      padding-top: 14px;
      font-size: 13.5px;
    }
    .info-row {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed #ebe5d9;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key {
      width: 68px;
      flex-shrink: 0;
      color: var(--gold);
      font-weight: 600;
      font-size: 12.5px;
    }
    .info-val { flex: 1; color: var(--ink); word-break: keep-all; font-weight: 500; }
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-kakao {
      background: var(--kakao);
      color: var(--kakao-ink);
      border: none;
      border-radius: 11px;
      padding: 14px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .btn-sms {
      background: linear-gradient(180deg, #25303f 0%, var(--navy) 100%);
      color: #f9f6ef;
      border: none;
      border-radius: 11px;
      padding: 14px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(22, 29, 38, 0.16);
    }
    .btn-copy {
      width: 100%;
      margin-top: 8px;
      background: var(--accent-soft);
      color: var(--navy);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 29, 38, 0.94);
      color: #f9f6ef;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid rgba(176, 141, 87, 0.4);
      display: none;
      z-index: 99;
      white-space: nowrap;
    }
    .viewer-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .viewer-actions a, .viewer-actions button {
      flex: 1;
      min-width: 120px;
      text-align: center;
      text-decoration: none;
      padding: 12px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      background: var(--navy);
      color: #f9f6ef;
      border: 1px solid var(--navy);
      cursor: pointer;
    }
    .viewer-actions button {
      background: #f5f1e8;
      color: var(--navy);
      border-color: #d7cdbc;
    }
    .hidden { display: none !important; }
    .template-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>호 수 장 의</h1>
  </header>

  <div class="wrap">
    <!-- 공유 링크로 열었을 때 보이는 뷰어 모드 -->
    <div id="viewerMode" class="hidden">
      <div class="card preview-box" id="viewerCard"></div>
      <div class="card" style="padding: 14px 16px;">
        <div class="share-grid" style="margin-top: 0;">
          <button class="btn-kakao" onclick="shareViewerKakao()">카카오톡으로 공유하기</button>
          <button class="btn-sms" onclick="shareViewerSMS()">문자로 공유하기</button>
        </div>
      </div>
    </div>

    <!-- 관리자 로그인 화면 -->
    <div id="loginMode" class="hidden">
      <div class="card" style="max-width: 400px; margin: 24px auto;">
        <h2>관리자 로그인</h2>
        <div class="field">
          <label>아이디</label>
          <input id="adminId" autocomplete="username" placeholder="관리자 아이디" />
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input id="adminPw" type="password" autocomplete="current-password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') handleAdminLogin()" />
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); margin: 10px 0 14px; cursor:pointer;">
          <input id="keepLogin" type="checkbox" checked style="width:auto;" />
          <span>이 기기에서 로그인 유지</span>
        </label>
        <button class="btn-sms" style="width:100%;" onclick="handleAdminLogin()">로그인</button>
        <p id="loginErr" style="color:#b91c1c; font-size:12px; margin:10px 0 0; display:none;">아이디 또는 비밀번호가 올바르지 않습니다.</p>
      </div>
    </div>

    <!-- 작성 모드 -->
    <div id="editorMode" class="hidden">
      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
        <button class="btn-sm" onclick="logoutAdmin()">로그아웃</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabBugo" onclick="switchTab('bugo')">부고장 만들기</button>
        <button class="tab-btn" id="tabThanks" onclick="switchTab('thanks')">답례인사 만들기</button>
      </div>

      <!-- 1. 부고장 작성 패널 -->
      <section id="panelBugo">
        <div class="card">
          <h2>고인 및 장례 정보 <button class="btn-sm" onclick="resetBugo()">초기화</button></h2>
          <div class="grid-2">
            <div class="field">
              <label>고인 성함</label>
              <input id="bName" placeholder="예: 홍길동" oninput="renderBugo()" />
            </div>
            <div class="field">
              <label>향년 (연세)</label>
              <input id="bAge" placeholder="예: 82세" oninput="renderBugo()" />
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>별세 일시</label>
              <input id="bDeath" placeholder="예: 2026년 11월 22일 오전 9시" oninput="renderBugo()" />
            </div>
            <div class="field">
              <label>발인 일시</label>
              <input id="bFuneral" placeholder="예: 2026년 11월 24일 오전 8시" oninput="renderBugo()" />
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>장례식장명</label>
              <input id="bHall" placeholder="예: 천안단국대병원 장례식장" oninput="renderBugo()" />
            </div>
            <div class="field">
              <label>빈소 (호실)</label>
              <input id="bRoom" placeholder="예: 특1호실" oninput="renderBugo()" />
            </div>
          </div>
          <div class="field">
            <label>장례식장 주소</label>
            <input id="bAddr" placeholder="예: 충남 천안시 동남구 망향로 201" oninput="renderBugo()" />
          </div>
          <div class="field">
            <label>장지</label>
            <input id="bBurial" placeholder="예: 천안추모공원" oninput="renderBugo()" />
          </div>
        </div>

        <div class="card">
          <h2>상주 정보 <button class="btn-sm" onclick="addSangju()">+ 상주 추가</button></h2>
          <div id="sangjuList"></div>
          <div class="grid-2" style="margin-top: 10px;">
            <div class="field">
              <label>은행명 (선택)</label>
              <input id="bBank" placeholder="예: 국민은행" oninput="renderBugo()" />
            </div>
            <div class="field">
              <label>계좌번호 (선택)</label>
              <input id="bAccountNum" inputmode="numeric" placeholder="예: 123456-01-123456" oninput="renderBugo()" />
            </div>
          </div>
          <div class="field">
            <label>인사말</label>
            <div class="template-pills">
              <button class="btn-sm" onclick="setBugoMsg('basic')">정중한 기본형</button>
              <button class="btn-sm" onclick="setBugoMsg('short')">간결형</button>
            </div>
            <textarea id="bMsg" oninput="renderBugo()"></textarea>
          </div>
        </div>

        <div class="card">
          <h2>미리보기 및 전송</h2>
          <div class="preview-box" id="bugoPreview"></div>
          <div class="share-grid">
            <button class="btn-kakao" onclick="shareKakao('bugo')">카카오톡으로 보내기</button>
            <button class="btn-sms" onclick="sendSMS('bugo')">문자로 보내기</button>
          </div>
          <button class="btn-copy" onclick="copyText('bugo')">부고장 문구 + 링크 전체 복사</button>
        </div>
      </section>

      <!-- 2. 답례인사 작성 패널 -->
      <section id="panelThanks" class="hidden">
        <div class="card">
          <h2>답례인사 작성 <button class="btn-sm" onclick="resetThanks()">초기화</button></h2>
          <div class="grid-2">
            <div class="field">
              <label>고인 성함</label>
              <input id="tDeceased" placeholder="예: 故 홍길동" oninput="renderThanks()" />
            </div>
            <div class="field">
              <label>상주 (보내는 분)</label>
              <input id="tSender" placeholder="예: 홍상주 올림" oninput="renderThanks()" />
            </div>
          </div>
          <div class="field">
            <label>답례 문구 템플릿</label>
            <div class="template-pills">
              <button class="btn-sm" onclick="setThanksMsg('basic')">기본 감사형</button>
              <button class="btn-sm" onclick="setThanksMsg('flower')">조문·조화 감사형</button>
              <button class="btn-sm" onclick="setThanksMsg('short')">간결 문자형</button>
            </div>
            <textarea id="tMsg" style="min-height: 130px;" oninput="renderThanks()"></textarea>
          </div>
        </div>

        <div class="card">
          <h2>미리보기 및 전송</h2>
          <div class="preview-box" id="thanksPreview"></div>
          <div class="share-grid">
            <button class="btn-kakao" onclick="shareKakao('thanks')">카카오톡으로 보내기</button>
            <button class="btn-sms" onclick="sendSMS('thanks')">문자로 보내기</button>
          </div>
          <button class="btn-copy" onclick="copyText('thanks')">답례인사 문구 전체 복사</button>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const BUGO_TEMPLATES = {
      basic: "삼가 부고(訃告)를 알립니다.\n바쁘시더라도 부디 오셔서 고인의 마지막 길을 따뜻하게 배웅해 주시면 감사하겠습니다.",
      short: "삼가 알립니다.\n먼 길 마다치 않으시고 고인의 명복을 빌어주시면 감사하겠습니다."
    };
    const THANKS_TEMPLATES = {
      basic: "삼가 감사 인사 올립니다.\n바쁘신 와중에도 따뜻한 위로와 조의를 베풀어 주신 덕분에 장례를 무사히 마칠 수 있었습니다.\n직접 찾아뵙고 인사드려야 도리이나 우선 글로 대신함을 너그러이 양해 부탁드립니다.\n베풀어 주신 은혜 오래도록 잊지 않겠습니다.",
      flower: "진심으로 감사드립니다.\n상중에 바쁘신 가운데에도 직접 조문해 주시고, 따뜻한 마음과 화환·부의로 큰 위로를 전해 주셔서 깊이 감사드립니다.\n경황이 없어 일일이 찾아뵙지 못하고 먼저 문자로 감사 인사를 올립니다.",
      short: "바쁘신 중에도 조문과 따뜻한 위로 보내주셔서 진심으로 감사드립니다. 덕분에 무사히 잘 모셨습니다. 늘 건강과 평안을 기원합니다."
    };

    let sangju = [
      { rel: "상주", name: "", phone: "" }
    ];

    const $ = (id) => document.getElementById(id);

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2400);
    }

    function encodeData(obj) {
      const json = JSON.stringify(obj);
      return btoa(unescape(encodeURIComponent(json)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    function decodeData(str) {
      let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    }

    function switchTab(tab) {
      $("tabBugo").classList.toggle("active", tab === "bugo");
      $("tabThanks").classList.toggle("active", tab === "thanks");
      $("panelBugo").classList.toggle("hidden", tab !== "bugo");
      $("panelThanks").classList.toggle("hidden", tab !== "thanks");
    }

    function renderSangjuInputs() {
      const box = $("sangjuList");
      box.innerHTML = sangju.map((s, i) => `
        <div class="sangju-row">
          <input placeholder="관계" value="${esc(s.rel)}" oninput="updateSangju(${i}, 'rel', this.value)" />
          <input placeholder="성함" value="${esc(s.name)}" oninput="updateSangju(${i}, 'name', this.value)" />
          <input placeholder="연락처" value="${esc(s.phone)}" oninput="updateSangju(${i}, 'phone', this.value)" />
          <button class="btn-del" onclick="removeSangju(${i})" title="삭제">✕</button>
        </div>
      `).join("");
    }

    function esc(v) {
      return String(v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    window.addSangju = () => {
      sangju.push({ rel: "자", name: "", phone: "" });
      renderSangjuInputs();
      renderBugo();
    };
    window.removeSangju = (i) => {
      if (sangju.length <= 1) return;
      sangju.splice(i, 1);
      renderSangjuInputs();
      renderBugo();
    };
    window.updateSangju = (i, key, val) => {
      sangju[i][key] = val;
      renderBugo();
    };

    function getBugoData() {
      return {
        name: $("bName").value.trim(),
        age: $("bAge").value.trim(),
        death: $("bDeath").value.trim(),
        funeral: $("bFuneral").value.trim(),
        hall: $("bHall").value.trim(),
        room: $("bRoom").value.trim(),
        addr: $("bAddr").value.trim(),
        burial: $("bBurial").value.trim(),
        bank: $("bBank").value.trim(),
        accountNum: $("bAccountNum").value.trim(),
        msg: $("bMsg").value.trim(),
        sangju: sangju.filter((s) => s.name.trim() || s.phone.trim())
      };
    }

    function buildBugoHTML(d) {
      const titleName = d.name ? `故 ${esc(d.name)}` : "故 ○○○";
      const ageText = d.age ? ` (향년 ${esc(d.age)})` : "";
      const sangjuText = d.sangju.length
        ? d.sangju.map((s) => `${esc(s.rel)} ${esc(s.name)} ${s.phone ? `(${esc(s.phone)})` : ""}`).join("<br/>")
        : "상주 정보를 입력해 주세요";
      const mapUrl = d.addr || d.hall
        ? `https://map.kakao.com/link/search/${encodeURIComponent(d.addr || d.hall)}`
        : "";
      const firstPhone = d.sangju.find((s) => s.phone.trim())?.phone.trim() || "";
      const accountDisplay = [d.bank, d.accountNum].filter(Boolean).join(" ") || d.account || "";
      const accountCopyRaw = d.accountNum || d.account || "";

      return `
        <div class="preview-hero">
          <div class="hero-kanji">謹 弔</div>
          <div class="hero-brand">삼가 고인의 명복을 빕니다</div>
        </div>
        <div class="preview-body">
          <div class="preview-ribbon">
            <span class="ribbon-tag">謹 弔 · 호수장의</span>
            <h3 class="preview-title">${titleName}${ageText} 별세</h3>
            <p class="preview-sub">${d.death ? `별세: ${esc(d.death)}` : "별세 일시 미입력"}</p>
          </div>
          <div class="preview-msg">${esc(d.msg || BUGO_TEMPLATES.basic)}</div>
          <div class="info-list">
            <div class="info-row"><span class="info-key">빈소</span><span class="info-val">${esc(d.hall || "-")} ${esc(d.room)}</span></div>
            ${d.addr ? `<div class="info-row"><span class="info-key">주소</span><span class="info-val">${esc(d.addr)}</span></div>` : ""}
            <div class="info-row"><span class="info-key">발인</span><span class="info-val">${esc(d.funeral || "-")}</span></div>
            ${d.burial ? `<div class="info-row"><span class="info-key">장지</span><span class="info-val">${esc(d.burial)}</span></div>` : ""}
            <div class="info-row"><span class="info-key">상주</span><span class="info-val">${sangjuText}</span></div>
            ${accountDisplay ? `<div class="info-row"><span class="info-key">부의계좌</span><span class="info-val">${esc(accountDisplay)}</span></div>` : ""}
          </div>
          <div class="viewer-actions">
            ${mapUrl ? `<a href="${mapUrl}" target="_blank" rel="noopener">장례식장 지도 보기</a>` : ""}
            ${firstPhone ? `<a href="tel:${esc(firstPhone)}">상주 연락하기</a>` : ""}
            ${accountCopyRaw ? `<button onclick="copyAccountDigits('${esc(accountCopyRaw)}')">계좌번호 복사</button>` : ""}
          </div>
        </div>
      `;
    }

    function buildThanksHTML(d) {
      const dec = d.deceased ? `${esc(d.deceased)} ` : "";
      const sender = d.sender || "상주 올림";
      return `
        <div class="preview-hero">
          <div class="hero-kanji">感 謝</div>
          <div class="hero-brand">삼가 감사의 말씀을 올립니다</div>
        </div>
        <div class="preview-body">
          <div class="preview-ribbon">
            <span class="ribbon-tag">感 謝 · 호수장의</span>
            <h3 class="preview-title">삼가 감사 인사 올립니다</h3>
            <p class="preview-sub">${dec}장례에 따뜻한 위로를 보내주셔서 감사합니다</p>
          </div>
          <div class="preview-msg" style="text-align:left;">${esc(d.msg || THANKS_TEMPLATES.basic)}</div>
          <div style="text-align:right; font-family:'Noto Serif KR',serif; font-weight:600; color:var(--navy); font-size:15px; margin-top:14px;">
            ${esc(sender)}
          </div>
        </div>
      `;
    }

    function renderBugo() {
      const d = getBugoData();
      $("bugoPreview").innerHTML = buildBugoHTML(d);
      localStorage.setItem("hosu_bugo_draft", JSON.stringify({ ...d, sangju }));
    }

    function getThanksData() {
      return {
        deceased: $("tDeceased").value.trim(),
        sender: $("tSender").value.trim(),
        msg: $("tMsg").value.trim()
      };
    }

    function renderThanks() {
      const d = getThanksData();
      $("thanksPreview").innerHTML = buildThanksHTML(d);
      localStorage.setItem("hosu_thanks_draft", JSON.stringify(d));
    }

    function setBugoMsg(key) {
      $("bMsg").value = BUGO_TEMPLATES[key];
      renderBugo();
    }
    function setThanksMsg(key) {
      $("tMsg").value = THANKS_TEMPLATES[key];
      renderThanks();
    }

    function packBugo(d) {
      const m = {};
      if (d.name) m.n = d.name;
      if (d.age) m.a = d.age;
      if (d.death) m.d = d.death;
      if (d.funeral) m.f = d.funeral;
      if (d.hall) m.h = d.hall;
      if (d.room) m.r = d.room;
      if (d.addr) m.ad = d.addr;
      if (d.burial) m.b = d.burial;
      if (d.bank) m.bk = d.bank;
      if (d.accountNum) m.an = d.accountNum;
      if (d.account) m.ac = d.account;
      if (d.msg && d.msg !== BUGO_TEMPLATES.basic) m.m = d.msg;
      if (d.sangju && d.sangju.length) {
        m.s = d.sangju.map((s) => [s.rel || "", s.name || "", s.phone || ""]);
      }
      return m;
    }

    function unpackBugo(m) {
      if (m.name !== undefined || m.hall !== undefined || m.sangju !== undefined) {
        if (!m.sangju) m.sangju = [];
        return m;
      }
      return {
        name: m.n || "",
        age: m.a || "",
        death: m.d || "",
        funeral: m.f || "",
        hall: m.h || "",
        room: m.r || "",
        addr: m.ad || "",
        burial: m.b || "",
        bank: m.bk || "",
        accountNum: m.an || "",
        account: m.ac || "",
        msg: m.m || BUGO_TEMPLATES.basic,
        sangju: Array.isArray(m.s) ? m.s.map((x) => ({ rel: x[0] || "", name: x[1] || "", phone: x[2] || "" })) : []
      };
    }

    function packThanks(d) {
      const m = {};
      if (d.deceased) m.d = d.deceased;
      if (d.sender) m.s = d.sender;
      const tplKey = Object.keys(THANKS_TEMPLATES).find((k) => THANKS_TEMPLATES[k] === d.msg);
      if (tplKey) {
        if (tplKey !== "basic") m.k = tplKey;
      } else if (d.msg) {
        m.m = d.msg;
      }
      return m;
    }

    function unpackThanks(m) {
      if (m.deceased !== undefined || m.sender !== undefined) return m;
      return {
        deceased: m.d || "",
        sender: m.s || "",
        msg: m.m || THANKS_TEMPLATES[m.k || "basic"] || THANKS_TEMPLATES.basic
      };
    }

    let viewerState = null;

    function buildPayloadFromData(kind, d, customUrl) {
      const base = location.origin + location.pathname;
      if (kind === "bugo") {
        const url = customUrl || (base.startsWith("http") ? `${base}?b=${encodeData(packBugo(d))}` : "");
        const lines = [
          `[호수장의 모바일 부고장]`,
          `故 ${d.name || "○○○"}${d.age ? ` (향년 ${d.age})` : ""} 님께서 별세하셨기에 삼가 알려드립니다.`,
          d.death ? `• 별세: ${d.death}` : "",
          d.hall ? `• 빈소: ${d.hall} ${d.room}`.trim() : "",
          d.addr ? `• 주소: ${d.addr}` : "",
          d.funeral ? `• 발인: ${d.funeral}` : "",
          d.burial ? `• 장지: ${d.burial}` : "",
          d.sangju && d.sangju.length ? `• 상주: ${d.sangju.map((s) => `${s.rel} ${s.name} ${s.phone}`.trim()).join(" / ")}` : "",
          ([d.bank, d.accountNum].filter(Boolean).join(" ") || d.account) ? `• 부의계좌: ${[d.bank, d.accountNum].filter(Boolean).join(" ") || d.account}` : "",
          url ? `\n모바일 부고장 보기:\n${url}` : ""
        ].filter(Boolean).join("\n");
        return { title: `故 ${d.name || "○○○"} 님 부고장 - 호수장의`, text: lines, url };
      } else {
        const url = customUrl || (base.startsWith("http") ? `${base}?t=${encodeData(packThanks(d))}` : "");
        const lines = [
          `[호수장의 답례인사]`,
          d.msg || THANKS_TEMPLATES.basic,
          "",
          d.sender || "상주 올림",
          url ? `\n답례장 보기:\n${url}` : ""
        ].filter((v) => v !== "").join("\n");
        return { title: `감사 인사 - 호수장의`, text: lines, url };
      }
    }

    function buildSharePayload(kind) {
      const d = kind === "bugo" ? getBugoData() : getThanksData();
      return buildPayloadFromData(kind, d);
    }

    window.copyString = (str) => {
      navigator.clipboard?.writeText(str).then(() => showToast("복사되었습니다."));
    };

    window.copyAccountDigits = (str) => {
      const digits = String(str || "").replace(/\D/g, "") || String(str || "");
      navigator.clipboard?.writeText(digits).then(() => showToast("계좌번호 숫자만 복사되었습니다."));
    };

    window.copyText = async (kind) => {
      const p = buildSharePayload(kind);
      await navigator.clipboard?.writeText(p.text);
      showToast("문구가 복사되었습니다. 카톡/문자에 붙여넣기 하세요!");
    };

    const KAKAO_JS_KEY = "441c77e0d13c53714b7acfa4c9f2ad96";
    const COVER_IMAGE_URL = "https://leejua486.github.io/hosu-jangui/cover.jpg";

    function ensureKakao() {
      if (window.Kakao && !window.Kakao.isInitialized()) {
        window.Kakao.init(KAKAO_JS_KEY);
      }
      return Boolean(window.Kakao && window.Kakao.isInitialized());
    }

    function runKakaoShare(kind, d, p) {
      const shareUrl = p.url || (location.origin + location.pathname);
      if (ensureKakao()) {
        try {
          let cardTitle = p.title;
          let cardDesc = "";
          let btnTitle = "모바일 부고장 보기";
          if (kind === "bugo") {
            cardTitle = `[호수장의 부고] 故 ${d.name || "○○○"}${d.age ? ` (향년 ${d.age})` : ""}`;
            const parts = [
              d.hall ? `빈소: ${d.hall} ${d.room}`.trim() : "",
              d.funeral ? `발인: ${d.funeral}` : ""
            ].filter(Boolean);
            cardDesc = parts.join(" · ") || "삼가 고인의 명복을 빕니다.";
            btnTitle = "모바일 부고장 보기";
          } else {
            cardTitle = "[호수장의] 삼가 감사 인사 올립니다";
            cardDesc = (d.msg || THANKS_TEMPLATES.basic).split("\n")[0];
            btnTitle = "답례인사 보기";
          }
          window.Kakao.Share.sendDefault({
            objectType: "feed",
            content: {
              title: cardTitle,
              description: cardDesc,
              imageUrl: COVER_IMAGE_URL,
              imageWidth: 640,
              imageHeight: 800,
              link: { mobileWebUrl: shareUrl, webUrl: shareUrl }
            },
            buttons: [
              {
                title: btnTitle,
                link: { mobileWebUrl: shareUrl, webUrl: shareUrl }
              }
            ],
            installTalk: true
          });
          return;
        } catch (e) {
          console.error("Kakao share failed:", e);
          showToast("카카오 공유 오류: " + (e?.message || "설정을 확인해 주세요."));
        }
      }
      if (navigator.share) {
        navigator.share({ title: p.title, text: p.text }).catch(() => {});
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(p.text).then(() => {
          showToast("복사 완료! 카카오톡 대화창에 바로 붙여넣기 하세요.");
        });
      }
    }

    window.shareKakao = function(kind) {
      const d = kind === "bugo" ? getBugoData() : getThanksData();
      const p = buildPayloadFromData(kind, d);
      runKakaoShare(kind, d, p);
    };

    window.shareViewerKakao = function() {
      if (!viewerState) return;
      const p = buildPayloadFromData(viewerState.kind, viewerState.data, viewerState.url);
      runKakaoShare(viewerState.kind, viewerState.data, p);
    };

    window.shareViewerSMS = function() {
      if (!viewerState) return;
      const p = buildPayloadFromData(viewerState.kind, viewerState.data, viewerState.url);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const sep = isIOS ? "&" : "?";
      location.href = `sms:${sep}body=${encodeURIComponent(p.text)}`;
    };

    window.sendSMS = (kind) => {
      const p = buildSharePayload(kind);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const sep = isIOS ? "&" : "?";
      location.href = `sms:${sep}body=${encodeURIComponent(p.text)}`;
    };

    window.resetBugo = () => {
      if (!confirm("작성 중인 부고장을 초기화할까요?")) return;
      ["bName", "bAge", "bDeath", "bFuneral", "bHall", "bRoom", "bAddr", "bBurial", "bBank", "bAccountNum"].forEach((id) => $(id).value = "");
      $("bMsg").value = BUGO_TEMPLATES.basic;
      sangju = [{ rel: "상주", name: "", phone: "" }];
      renderSangjuInputs();
      renderBugo();
    };

    window.resetThanks = () => {
      if (!confirm("작성 중인 답례인사를 초기화할까요?")) return;
      $("tDeceased").value = "";
      $("tSender").value = "";
      $("tMsg").value = THANKS_TEMPLATES.basic;
      renderThanks();
    };

    const ADMIN_AUTH_HASH = "946558635e78730b08d87eeeffc125a8049a877a83fbdbdd2d407bdff5ea71cf";
    const AUTH_KEY = "hosu_admin_token_v1";

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function isAdminAuthed() {
      return localStorage.getItem(AUTH_KEY) === ADMIN_AUTH_HASH ||
             sessionStorage.getItem(AUTH_KEY) === ADMIN_AUTH_HASH;
    }

    function openEditor() {
      $("loginMode").classList.add("hidden");
      $("editorMode").classList.remove("hidden");
    }

    window.handleAdminLogin = async function() {
      const id = $("adminId").value.trim();
      const pw = $("adminPw").value;
      const hash = await sha256Hex(`${id}:${pw}`);
      if (hash === ADMIN_AUTH_HASH) {
        $("loginErr").style.display = "none";
        if ($("keepLogin").checked) {
          localStorage.setItem(AUTH_KEY, ADMIN_AUTH_HASH);
        } else {
          sessionStorage.setItem(AUTH_KEY, ADMIN_AUTH_HASH);
        }
        $("adminPw").value = "";
        openEditor();
      } else {
        $("loginErr").style.display = "block";
      }
    };

    window.logoutAdmin = function() {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
      $("editorMode").classList.add("hidden");
      $("loginMode").classList.remove("hidden");
    };

    function init() {
      const params = new URLSearchParams(location.search);
      const hash = location.hash || "";
      const bugoParam = params.get("b") || (hash.startsWith("#bugo=") ? hash.slice(6) : "");
      const thanksParam = params.get("t") || (hash.startsWith("#thanks=") ? hash.slice(8) : "");
      if (bugoParam) {
        try {
          const d = unpackBugo(decodeData(bugoParam));
          viewerState = { kind: "bugo", data: d, url: location.href };
          $("viewerCard").innerHTML = buildBugoHTML(d);
          $("editorMode").classList.add("hidden");
          $("viewerMode").classList.remove("hidden");
          return;
        } catch {}
      } else if (thanksParam) {
        try {
          const d = unpackThanks(decodeData(thanksParam));
          viewerState = { kind: "thanks", data: d, url: location.href };
          $("viewerCard").innerHTML = buildThanksHTML(d);
          $("editorMode").classList.add("hidden");
          $("viewerMode").classList.remove("hidden");
          return;
        } catch {}
      }

      const savedBugo = JSON.parse(localStorage.getItem("hosu_bugo_draft") || "null");
      if (savedBugo) {
        $("bName").value = savedBugo.name || "";
        $("bAge").value = savedBugo.age || "";
        $("bDeath").value = savedBugo.death || "";
        $("bFuneral").value = savedBugo.funeral || "";
        $("bHall").value = savedBugo.hall || "";
        $("bRoom").value = savedBugo.room || "";
        $("bAddr").value = savedBugo.addr || "";
        $("bBurial").value = savedBugo.burial || "";
        $("bBank").value = savedBugo.bank || "";
        $("bAccountNum").value = savedBugo.accountNum || savedBugo.account || "";
        $("bMsg").value = savedBugo.msg || BUGO_TEMPLATES.basic;
        if (Array.isArray(savedBugo.sangju) && savedBugo.sangju.length) sangju = savedBugo.sangju;
      } else {
        $("bMsg").value = BUGO_TEMPLATES.basic;
      }

      const savedThanks = JSON.parse(localStorage.getItem("hosu_thanks_draft") || "null");
      if (savedThanks) {
        $("tDeceased").value = savedThanks.deceased || "";
        $("tSender").value = savedThanks.sender || "";
        $("tMsg").value = savedThanks.msg || THANKS_TEMPLATES.basic;
      } else {
        $("tMsg").value = THANKS_TEMPLATES.basic;
      }

      renderSangjuInputs();
      renderBugo();
      renderThanks();

      if (isAdminAuthed()) {
        openEditor();
      } else {
        $("loginMode").classList.remove("hidden");
      }
    }

    init();
  </script>
</body>
</html>
